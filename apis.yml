name: 6river
description: '6 River Systems (6RS) is a warehouse fulfillment automation company founded in 2015 in
  Waltham, Massachusetts. Its flagship product is "Chuck," a collaborative autonomous mobile robot (AMR)
  that works alongside human associates to guide and optimize picking, sorting, and replenishment in
  distribution centers. The platform is WMS-agnostic and integrates with existing warehouse-management
  systems as an intelligent execution layer via a private/partner REST API for host data exchange; it
  does not publish a public developer portal, API documentation, or consumer SDKs. Norwest Venture
  Partners was an early investor; the company was acquired by Shopify in 2019 and by Ocado Group in 2023.
  The public marketing site at 6river.com currently serves a parked lander stub.'
